<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a sketch TOP</title>
    <script src="scripts.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="side-space"></div>

        <div class="center">
            <div class="control">
                <div class="info-size">
                    <p id="textValueSize"></p>
                    <button id="sizeBtn"> Grid Size </button>
                </div>

                <div class="draw-buttons">
                    <input  id="colorInput" type="color">
                    <button id="colorPick" class="mode-btn"><div class="color-frame"></div>Pick Color</button>
                    <button id="rgbBtn" class="mode-btn">RGB button</button>
                    <button id="eraserBtn" class="mode-btn">Eraser</button>
                    <button id="shadingBtn" class="mode-btn">Shading</button>
                </div>
            </div>
            <div class="grid"></div>
        </div>

        <div class="side-space"></div>
    </div>
</body>
</html>
